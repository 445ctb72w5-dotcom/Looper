<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>Video Looper</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      background: #000;
    }

    #picker {
      display: none;
    }

    #choose {
      appearance: none;
      border: 0;
      border-radius: 14px;
      padding: 15px 22px;
      font-size: 17px;
      font-weight: 600;
      color: #000;
      background: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #choose:active {
      transform: scale(.97);
    }

    #change {
      position: fixed;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 2;
      display: none;
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 10px 15px;
      font-size: 14px;
      color: #000;
      background: rgba(255,255,255,.9);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <button id="choose" type="button">Choose Video</button>
  <input id="picker" type="file" accept="video/*">
  <video id="video" autoplay loop playsinline></video>
  <button id="change" type="button">Choose Another</button>

  <script>
    const picker = document.getElementById("picker");
    const choose = document.getElementById("choose");
    const change = document.getElementById("change");
    const video = document.getElementById("video");

    let objectUrl = null;

    function openPicker() {
      picker.click();
    }

    choose.addEventListener("click", openPicker);
    change.addEventListener("click", openPicker);

    picker.addEventListener("change", () => {
      const file = picker.files && picker.files[0];
      if (!file) return;

      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(file);

      video.src = objectUrl;
      video.style.display = "block";
      choose.style.display = "none";
      change.style.display = "block";

      video.play().catch(() => {});
    });

    window.addEventListener("beforeunload", () => {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
    });
  </script>
</body>
</html>
